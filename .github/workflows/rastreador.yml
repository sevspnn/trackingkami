name: Rastreador de Passagens (multi-rota)

on:
  schedule:
    - cron: '17 10 * * *'  # 07:17 America/Fortaleza — rodada de rotina (sempre manda e-mail)
    - cron: '17 16 * * *'  # 13:17
    - cron: '17 22 * * *'  # 19:17
    - cron: '17 4 * * *'   # 01:17
  workflow_dispatch:  # pra rodar manualmente durante a fase de validação
    inputs:
      forcar_rotina:
        description: 'Tratar essa execução manual como a rodada de rotina (envia o e-mail diário mesmo fora das 07:17, ex. pra repor uma rodada perdida)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rastreador-nat-bhz
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # cobre até 20min de jitter + consultas + retries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Jitter (0-20min, só em rodadas agendadas)
        if: github.event_name == 'schedule'
        run: |
          SEGUNDOS=$(( RANDOM % 1200 ))
          echo "Aguardando ${SEGUNDOS}s de jitter antes de começar..."
          sleep "$SEGUNDOS"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar rastreador
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}      # rota "maceio"
          EMAIL_DESTINO_2: ${{ secrets.EMAIL_DESTINO_2 }}  # rota "sao_luis"
          EMAIL_DESTINO_3: ${{ secrets.EMAIL_DESTINO_3 }}  # rota "belo_horizonte"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Diz pro main.py se essa é a rodada de rotina (07:17) direto pelo
          # cron que disparou — não pela hora local depois do jitter, que o
          # agendador do Actions atrasa com frequência (ver runner.rodar).
          RODADA_ROTINA: ${{ github.event.schedule == '17 10 * * *' || inputs.forcar_rotina == true }}
        run: python main.py

      - name: Commitar banco de volta pro repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracker.db
          if git diff --cached --quiet; then
            echo "Nada novo no banco nesta rodada, pulando commit."
            exit 0
          fi

          HORA_LOCAL=$(TZ='America/Fortaleza' date '+%Y-%m-%d %H:%M')
          git commit -m "dados: rodada ${HORA_LOCAL}"

          # git push já falhou algumas vezes com "fatal error in commit_refs"
          # do lado do GitHub (transitório) — sem retry aqui, a rodada
          # inteira (dados + qualquer alerta que já tenha sido mandado por
          # e-mail) some do histórico persistente. 3 tentativas com backoff,
          # revalidando contra o remoto antes de tentar de novo.
          TENTATIVA=0
          MAX_TENTATIVAS=3
          until git push; do
            TENTATIVA=$((TENTATIVA + 1))
            if [ "$TENTATIVA" -ge "$MAX_TENTATIVAS" ]; then
              echo "git push falhou após ${MAX_TENTATIVAS} tentativas, desistindo."
              exit 1
            fi
            ESPERA=$((TENTATIVA * 8))
            echo "git push falhou (tentativa ${TENTATIVA}/${MAX_TENTATIVAS}), tentando de novo em ${ESPERA}s..."
            sleep "$ESPERA"
            git pull --rebase origin main || true
          done
